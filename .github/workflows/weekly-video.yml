name: Weekly Video
run-name: Weekly Video (${{ github.event_name }})
# Wochenvideo Deutsch und Englisch: Auswahl der fuenf Beitraege der Woche, Ton mit Marcels ElevenLabs-Stimme, Video mit Remotion
# (16:9 fuer YouTube, 4:5 fuer LinkedIn), Untertitel, Texte. Ergebnis als Download (Artifact), NICHTS wird veroeffentlicht.
#
# STATUS: AUS. Nur manuell startbar (workflow_dispatch). Der Zeitplan unten bleibt auskommentiert, bis Marcel nach dem ersten Video freigibt.
# Zum Einschalten: die zwei Zeilen unter "schedule" einkommentieren (Sonntag 17:00 UTC = 18:00 Winterzeit, 19:00 Sommerzeit).
# Kosten: nur vorhandene Abos. ElevenLabs rund 1'900 Zeichen je Seite und Woche (Budget-Deckel 2'000 im Lauf).
#
# Noetig vor dem ersten Lauf: Repo-Secret ELEVENLABS_API_KEY (Marcel setzt es selbst). Fuer Buffer-Ideen zusaetzlich Secret BUFFER_API_KEY
# und Variable BUFFER_ORG_ID; ohne beides laeuft der Buffer-Schritt nicht.
on:
  # schedule:
  #   - cron: "0 17 * * 0"
  workflow_dispatch:
    inputs:
      week:
        description: "Woche im Format 2026-W45 (leer = aktuelle Woche)"
        default: ""
      dry_run:
        description: "Nur Auswahl, Texte und Zeichenzahl zeigen (kein Ton, kein Video, kein Verbrauch)"
        type: boolean
        default: true
      buffer_ideas:
        description: "Danach Buffer-Ideen anlegen (Entwurf ohne Datum, kein Posting)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require the authorised actor
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_ACTOR" = 'MarceLehmann'
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System packages for Remotion (Chromium libraries, ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2
      - uses: actions/cache@v4
        with:
          path: tools/weekly-video/node_modules
          key: weekly-video-node-${{ hashFiles('tools/weekly-video/package.json') }}
      - name: Install Remotion
        working-directory: tools/weekly-video
        run: npm install --no-audit --no-fund
      - name: Unit tests (no API call)
        working-directory: tools/weekly-video
        run: node --test weekly-video.test.mjs
      - name: Select, speak and render
        working-directory: tools/weekly-video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          WEEK: ${{ inputs.week }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          args=(--root ../.. --lang de,en --budget 2000)
          [ -n "$WEEK" ] && args+=(--week "$WEEK")
          [ "$DRY" = "true" ] && args+=(--dry-run)
          node run.mjs "${args[@]}"
      - name: Keep the result for download
        if: inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: weekly-video
          path: |
            tools/weekly-video/out/*/*.mp4
            tools/weekly-video/out/*/*.srt
            tools/weekly-video/out/*/*.md
            tools/weekly-video/out/*/*.txt
            tools/weekly-video/out/*/manifest.json
          retention-days: 14
      - name: Buffer ideas (draft without date, no posting)
        if: inputs.dry_run != true && inputs.buffer_ideas == true
        working-directory: tools/weekly-video
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORG_ID: ${{ vars.BUFFER_ORG_ID }}
        run: |
          set -euo pipefail
          dir=$(ls -d out/*/ | grep -v _audio-cache | sort | tail -1)
          node buffer.mjs --dir "$dir" --org "$BUFFER_ORG_ID" --apply
