name: IndexNow Ping

# Meldet alle Sitemap-URLs nach jedem Content-Push an IndexNow (Bing, Copilot,
# Yandex u. a.), damit neue oder geaenderte Seiten schneller gecrawlt werden.
# Liest die URL-Liste direkt aus dem live sitemap.xml, damit neue Artikel aus
# der Curation-Pipeline automatisch mit erfasst werden.
# Ergaenzt die normale Sitemap-Erfassung; ersetzt sie nicht.
# Hinweis: IndexNow wird von Bing/Yandex konsumiert, NICHT von Google -
# fuer Google bleiben sitemap.xml und interne Verlinkung die massgeblichen Signale.

on:
  # Marcel 26.10.2026: taeglich (neue kuratierte Artikel), kein Push-Ausloeser mehr.
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Submit alle Sitemap-URLs an IndexNow
        run: |
          curl -sS https://powerplatformgovernance.com/sitemap.xml -o sitemap.xml
          node -e "
            const fs = require('fs');
            const xml = fs.readFileSync('sitemap.xml', 'utf8');
            const urls = [...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1]);
            if (urls.length === 0) { throw new Error('Keine URLs in sitemap.xml gefunden'); }
            fs.writeFileSync('indexnow-payload.json', JSON.stringify({
              host: 'powerplatformgovernance.com',
              key: 'bc2d7106a7e3443f761906c6b7b7f5b0',
              keyLocation: 'https://powerplatformgovernance.com/bc2d7106a7e3443f761906c6b7b7f5b0.txt',
              urlList: urls,
            }));
            console.log(urls.length + ' URLs aus sitemap.xml an IndexNow uebermittelt');
          "
          curl -sS --fail-with-body -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @indexnow-payload.json
