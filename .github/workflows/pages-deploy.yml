name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    # Entscheid 22 (26.10.2026): kein Deploy bei reinen Notizen, Doku und Pruef-Workflows.
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - 'README_CUSTOM.md'
      - '*_architektur_*.md'
      - 'docs/**'
      - '.devcontainer/**'
      - '.vscode/**'
      - '.github/workflows/indexnow.yml'
      - '.github/workflows/daily-digest.yml'
      - '.github/workflows/auto-gif.yml'
      - '.github/workflows/auto-gif-social.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Entscheid 22 (26.10.2026): pro Branch nur der neueste Lauf, aeltere werden abgebrochen.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test automation contracts
        run: |
          node --test tools/*.test.mjs
          bundle exec ruby tools/test-publish-curation.rb
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Check rendered site
        run: bundle exec ruby tools/check-site.rb "_site${{ steps.pages.outputs.base_path }}"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"
          name: github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Entscheid e-1104-indexnow (Marcel 05.11.2026): IndexNow-Ping im bestehenden Deploy, kein eigener Workflow mehr.
  # Bing, Yandex, Seznam u. a. (Google nutzt IndexNow nicht). Schluesseldatei liegt im Wurzelordner der Seite.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: IndexNow melden
        env:
          HOST: powerplatformgovernance.com
          KEY: bc2d7106a7e3443f761906c6b7b7f5b0
          EVENT: ${{ github.event_name }}
        run: |
          sleep 45
          # --fail: HTTP-Fehler (404, 5xx) brechen den Schritt ab, statt eine Fehlerseite als Sitemap zu lesen. --location folgt Weiterleitungen.
          curl -sS --fail --location --retry 5 --retry-delay 10 --retry-all-errors "https://$HOST/sitemap.xml" -o sitemap.xml
          node - <<'EOF'
          const fs = require('fs');
          const xml = fs.readFileSync('sitemap.xml', 'utf8');
          const entries = [...xml.matchAll(/<url>([\s\S]*?)<\/url>/g)].map(m => ({
            loc: (m[1].match(/<loc>(.*?)<\/loc>/) || [])[1],
            lastmod: (m[1].match(/<lastmod>(.*?)<\/lastmod>/) || [])[1],
          })).filter(e => e.loc);
          let urls = entries.map(e => e.loc);
          if (urls.length === 0) { console.error('Keine URLs in sitemap.xml gefunden, IndexNow nicht gemeldet.'); process.exit(1); }
          // Alles ausser Push (Nachtlauf, Kurations-Deploy per workflow_dispatch): nur URLs mit lastmod der letzten 2 Tage.
          if (process.env.EVENT !== 'push') {
            const since = Date.now() - 2 * 86400000;
            urls = entries.filter(e => e.lastmod && Date.parse(e.lastmod) >= since).map(e => e.loc);
            if (urls.length === 0) { console.log('Keine geaenderten URLs in den letzten 2 Tagen, nichts zu melden.'); process.exit(0); }
          }
          fs.writeFileSync('indexnow-payload.json', JSON.stringify({
            host: process.env.HOST,
            key: process.env.KEY,
            keyLocation: `https://${process.env.HOST}/${process.env.KEY}.txt`,
            urlList: urls,
          }));
          console.log(urls.length + ' URLs an IndexNow gemeldet');
          EOF
          if [ -f indexnow-payload.json ]; then
            curl -sS --fail-with-body -X POST https://api.indexnow.org/indexnow \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data-binary @indexnow-payload.json
          fi
