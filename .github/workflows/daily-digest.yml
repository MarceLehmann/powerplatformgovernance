name: Daily Governance Digest

on:
  schedule:
    # 17:00 UTC ≈ 19:00 Europe/Zurich (CEST) / 18:00 (CET) - runs once daily
    - cron: "0 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send digest (if there are new curated posts today)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python3 tools/send_digest.py

      - name: Commit updated digest state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/digest-sent.json
          git diff --staged --quiet || git commit -m "Record sent digest articles [skip ci]"
          git push
