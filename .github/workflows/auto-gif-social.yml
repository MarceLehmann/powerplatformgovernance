name: Auto GIF LinkedIn
run-name: Auto GIF LinkedIn (${{ github.event_name }})
# LinkedIn ueber Buffer: alle neuen Governance-Beitraege (curated_summary und original_article) sind Kandidaten,
# hoechstens 3 Beitraege pro Kalendertag (Europe/Zurich), zuerst Beitraege mit Video (Auto-GIF), dann mit Bild, neueste zuerst.
# Standard: es wird NICHTS gesendet (Trockenlauf). Mit der Repo-Variable BUFFER_SEND=true entsteht ein Buffer-ENTWURF,
# erst mit BUFFER_MODE=queue geht ein Beitrag in die Buffer-Warteschlange (optional BUFFER_SLOTS="09:00,12:00,15:00" fuer feste Zeiten).
# Ausloeser: nach jedem Build and Deploy (also nach Publish und Auto GIF) und geplant mehrmals taeglich.
on:
  workflow_run:
    workflows: ["Build and Deploy"]
    types: [completed]
  schedule:
    - cron: "40 6,9,12,15,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-gif-social
  cancel-in-progress: false

jobs:
  social:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: tools/animation/node_modules
          key: autogif-node-${{ hashFiles('tools/animation/package.json') }}
      - name: Install dependencies (only the YAML parser is used, no scripts)
        working-directory: tools/animation
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Send pending posts to Buffer
        env:
          BUFFER_SEND: ${{ vars.BUFFER_SEND }}
          BUFFER_MODE: ${{ vars.BUFFER_MODE }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          BUFFER_SLOTS: ${{ vars.BUFFER_SLOTS }}
          BUFFER_DAILY_CAP: ${{ vars.BUFFER_DAILY_CAP }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node tools/animation/social.mjs --root . --site-url powerplatformgovernance.com
      - name: Commit the new state
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add -A -- tools/animation
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record LinkedIn hand-off state [skip ci]'
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
