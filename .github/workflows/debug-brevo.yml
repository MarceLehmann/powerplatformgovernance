name: Debug Brevo Key
on:
  workflow_dispatch: {}
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check key
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          curl -s -o /tmp/resp.json -w "HTTP %{http_code}\n" "https://api.brevo.com/v3/account" -H "api-key: $BREVO_API_KEY"
          cat /tmp/resp.json
