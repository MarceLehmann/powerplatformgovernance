<!-- Global site tag (gtag.js) - Google Analytics, consent-gated -->
<!-- Only loads/fires after the visitor accepts the cookie-consent banner (see cookie-consent.html) -->
<script>
(function(){
  function getCookie(name){
    const nameEQ = name + '=';
    const ca = document.cookie.split(';');
    for (let i = 0; i < ca.length; i++) {
      let c = ca[i];
      while (c.charAt(0) === ' ') c = c.substring(1);
      if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length);
    }
    return null;
  }
  function loadGA(){
    if (window.__gaLoaded) return;
    window.__gaLoaded = true;
    const s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google.id }}';
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){ dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', '{{ site.analytics.google.id }}');
  }
  if (getCookie('cookie_consent') === 'accepted') {
    loadGA();
  } else {
    window.addEventListener('cookie-consent:accepted', loadGA);
  }
})();
</script>
