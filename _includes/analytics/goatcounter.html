<!-- GoatCounter: cookieless page view counting; IP address never written to disk (held in memory for at most 8 hours). count.js is self-hosted (assets/js/count.js); only the count request goes to the goatcounter.com endpoint. Overrides the theme include, which would load count.js from gc.zgo.at. -->
<script async data-goatcounter="https://{{ site.analytics.goatcounter.id }}.goatcounter.com/count" src="{{ '/assets/js/count.js' | relative_url }}"></script>
